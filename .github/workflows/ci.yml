name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (fixture only, no data or network)
        run: uv run pytest -q
      - name: Smoke training through the CLI (fixture, seconds)
        run: |
          uv run python scripts/train.py --model configs/model/xgboost.yaml \
            --raw-dir tests/fixtures/raw --cache-dir /tmp/fixture-cache \
            --models-dir /tmp/models --tracking-uri sqlite:////tmp/mlflow.db
          test -f /tmp/models/xgb_raw.joblib
      - name: Stand-in served artifact from the fixture
        run: uv run python scripts/make_fixture_artifact.py
      - name: Docker build
        run: docker build -t fraud-risk-scoring:ci .
      - name: Container smoke test (/health must pass the startup parity check)
        run: |
          docker run -d --rm --name frs -p 8000:8000 fraud-risk-scoring:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health | grep -q '"parity_rows":10'
          curl -sf http://127.0.0.1:8000/model-info | grep -q '"primary_metric":"pr_auc"'
          docker stop frs
