# Continuous deployment on a version tag (docs/deployment.md).
#
#   scripts/release.py vX.Y.Z  →  git tag  →  this workflow:
#     checks   ci.yml (lint, types, tests, fixture image, container health)
#     render   POST the Render deploy hook with ?ref=<this tag's commit> (Render builds
#              exactly that commit from deploy/hosted/Dockerfile, no weights; the service
#              fetches the champion from its champion-<sha> GitHub release at startup),
#              wait until the live /health reports that same commit, check the live
#              champion is the one the tag was cut for, then scripts/deploy_check.py
#              needs: vars.RENDER_URL, secrets.RENDER_DEPLOY_HOOK  — the free, public demo
#     fly      flyctl deploy --image registry.fly.io/<app>:vX.Y.Z (image pushed by release.py
#              --fly-image), then deploy_check.py — the paid alternative
#              needs: vars.FLY_APP, secrets.FLY_API_TOKEN
#     release  GitHub release from the tag, after checks and configured deployments pass
#
# The model weights never enter the repository or a public image. The retraining
# workflow fits them on a runner (ADR 0012); the digest in the release tag is what
# the service pins against, not the machine that built it.
# Unconfigured deployment legs may be skipped; failed or cancelled legs block release.
name: deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  # Shared with deploy-champion.yml (ADR 0012), which ships a new model on the same
  # host without a code release: two deployments must never race for one service.
  group: render-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  render:
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    env:
      RENDER_URL: ${{ vars.RENDER_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the champion this tag was cut for
        # scripts/release.py records it in the tag annotation, on the machine that has
        # models/champion/ and verified its parity.
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha \
                | xargs -I{} gh api "repos/$GITHUB_REPOSITORY/git/tags/{}" --jq .message \
                | sed -n 's/.*(\([0-9a-f]\{12\}\)).*/\1/p')
          if [ -z "$sha" ]; then echo "tag annotation names no champion sha" >&2; exit 1; fi
          echo "CHAMPION_SHA=$sha" >> "$GITHUB_ENV"
          echo "champion for this release: $sha"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Point the host at this release's champion
        # Promotion and publication do not move the host; it fetches whatever
        # FRAUD_CHAMPION_URL names (docs/promotion.md). With a Render API key this closes
        # that hop; without one the step is skipped and the verify below fails the release
        # instead of drifting silently.
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "no RENDER_API_KEY/RENDER_SERVICE_ID: leaving FRAUD_CHAMPION_URL alone."
            echo "Set it by hand if this release promotes a new champion."
            exit 0
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/champion-$CHAMPION_SHA"
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars"
          # One key at a time. The bulk PUT /env-vars replaces the whole list and would
          # delete every variable not restated.
          curl -sf "$api" -H "Authorization: Bearer $RENDER_API_KEY" > before.json
          curl -sf -X PUT "$api/FRAUD_CHAMPION_URL" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'content-type: application/json' \
            -d "$(python3 -c 'import json,sys;print(json.dumps({"value": sys.argv[1]}))' "$url")" \
            >/dev/null
          # Read it back: the value landed, and every other key came through untouched.
          # Comparing the whole key set beats naming one variable as a canary — that only
          # detects a wholesale replacement while that particular variable still exists.
          curl -sf "$api" -H "Authorization: Bearer $RENDER_API_KEY" > after.json
          python3 - "$url" <<'PY'
          import json, sys
          want = sys.argv[1]
          def entries(path):
              return {e["envVar"]["key"]: e["envVar"]["value"] for e in json.load(open(path))}
          before, after = entries("before.json"), entries("after.json")
          if after.get("FRAUD_CHAMPION_URL") != want:
              sys.exit(f"FRAUD_CHAMPION_URL is {after.get('FRAUD_CHAMPION_URL')!r}, wanted {want!r}")
          lost = sorted(set(before) - set(after))
          if lost:
              sys.exit(f"the write dropped {lost}: it replaced the whole list")
          changed = [k for k, v in after.items() if k != "FRAUD_CHAMPION_URL" and before.get(k) != v]
          if changed:
              sys.exit(f"the write changed {sorted(changed)} as well")
          print(f"host now points at champion-{want.rsplit('-', 1)[1]}; {len(after)} vars intact")
          PY
          rm -f before.json after.json
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      - name: Trigger the Render deploy of this tag's commit through the deploy hook
        # Without ?ref= the hook builds whatever the tip of render.yaml's `branch: main`
        # is when Render starts the build, which need not be the commit this tag names
        # and CI just checked. Pinning the SHA removes that gap; the hook answers 200
        # only for a valid commit, so a bad ref fails this step instead of shipping.
        run: |
          set -euo pipefail
          hook="${{ secrets.RENDER_DEPLOY_HOOK }}"
          sep='?'; case "$hook" in *\?*) sep='&';; esac
          curl -sf -X POST "${hook}${sep}ref=${GITHUB_SHA}" >/dev/null
          echo "requested deploy of ${GITHUB_SHA}"
      - uses: astral-sh/setup-uv@v7
      - name: Wait for the new build to serve, then verify it
        run: |
          set -euo pipefail
          expected=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # The version alone cannot confirm which commit is live: every commit between
          # one release bump and the next carries the same version, so a build of the
          # wrong commit would satisfy it. Wait for the commit, and treat the version as
          # a secondary check.
          for i in $(seq 1 60); do
            live=$(curl -sf "$RENDER_URL/health" | python3 -c "import json,sys;print(json.load(sys.stdin).get('build_commit') or '')" || true)
            if [ "$live" = "$GITHUB_SHA" ]; then break; fi
            sleep 20
          done
          live=$(curl -sf "$RENDER_URL/health" | python3 -c "import json,sys;print(json.load(sys.stdin).get('build_commit') or '')")
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "live service reports commit '${live:-unknown}', expected $GITHUB_SHA" >&2
            exit 1
          fi
          curl -sf "$RENDER_URL/openapi.json" | grep -q "\"version\":\"$expected\""
          # Which champion is live is a separate question from which code is live. The
          # host fetches the champion from the FRAUD_CHAMPION_URL set on it, which no
          # promotion or publication updates, so a new champion that nobody pointed the
          # host at leaves the old one serving — and, being correctly digest-pinned, it
          # passes every other check. scripts/release.py records the champion it cut this
          # release for in the tag annotation; deploy_check.py asserts the live service
          # has loaded that exact artifact.
          uv run --no-project python scripts/deploy_check.py "$RENDER_URL" \
            --expected-artifact-sha "$CHAMPION_SHA"
        env:
          FRAUD_API_KEY: ${{ secrets.FRAUD_API_KEY }}
          GH_TOKEN: ${{ github.token }}

  fly:
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ vars.FLY_APP != '' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
    steps:
      - uses: actions/checkout@v7
      # Pinned to a release, not @master: this step runs third-party code in the job
      # that holds FLY_API_TOKEN, and a floating branch is whatever it is that day.
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - name: Deploy the image built for this tag
        run: |
          flyctl deploy --app "$FLY_APP" \
            --image "registry.fly.io/$FLY_APP:${GITHUB_REF_NAME}" \
            --strategy immediate
      - uses: astral-sh/setup-uv@v7
      - name: Verify the live service (health + parity, model-info, scored sample)
        run: |
          set -euo pipefail
          want=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha \
                 | xargs -I{} gh api "repos/$GITHUB_REPOSITORY/git/tags/{}" --jq .message \
                 | sed -n 's/.*(\([0-9a-f]\{12\}\)).*/\1/p')
          uv run --no-project python scripts/deploy_check.py "https://$FLY_APP.fly.dev" \
            --expected-artifact-sha "$want"
        env:
          FRAUD_API_KEY: ${{ secrets.FRAUD_API_KEY }}
          GH_TOKEN: ${{ github.token }}

  release:
    needs: [checks, render, fly]
    # Override the default success() so an unconfigured host may be skipped.
    if: >-
      ${{ !cancelled() &&
          needs.checks.result == 'success' &&
          (needs.render.result == 'success' || needs.render.result == 'skipped') &&
          (needs.fly.result == 'success' || needs.fly.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: GitHub release from the tag
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "Served model: see models/champion/model_manifest.json on the release machine (weights are not published). Performance: README → Performance."
        env:
          GH_TOKEN: ${{ github.token }}
