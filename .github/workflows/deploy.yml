# Continuous deployment on a version tag (docs/deployment.md).
#
#   scripts/release.py vX.Y.Z  →  git tag  →  this workflow:
#     checks   ci.yml (lint, types, tests, fixture image, container health)
#     render   POST the Render deploy hook (Render builds main == this tag from
#              deploy/hosted/Dockerfile, no weights; the service fetches the champion from
#              its champion-<sha> GitHub release at startup), wait until the served version is the
#              tag's, then scripts/deploy_check.py against the live URL
#              needs: vars.RENDER_URL, secrets.RENDER_DEPLOY_HOOK  — the free, public demo
#     fly      flyctl deploy --image registry.fly.io/<app>:vX.Y.Z (image pushed by release.py
#              --fly-image), then deploy_check.py — the paid alternative
#              needs: vars.FLY_APP, secrets.FLY_API_TOKEN
#     release  GitHub release from the tag, after checks and configured deployments pass
#
# The model weights never enter the repository, a public runner or a public image.
# Unconfigured deployment legs may be skipped; failed or cancelled legs block release.
name: deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  render:
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    env:
      RENDER_URL: ${{ vars.RENDER_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger the Render deploy of main (== this tag) through the deploy hook
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" >/dev/null
      - uses: astral-sh/setup-uv@v6
      - name: Wait for the new build to serve, then verify it
        run: |
          set -euo pipefail
          expected=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # a free instance builds for a few minutes and cold-starts in ~1 min; poll up to 20 min
          for i in $(seq 1 60); do
            if curl -sf "$RENDER_URL/openapi.json" | grep -q "\"version\":\"$expected\""; then break; fi
            sleep 20
          done
          curl -sf "$RENDER_URL/openapi.json" | grep -q "\"version\":\"$expected\""
          uv run --no-project python scripts/deploy_check.py "$RENDER_URL"
        env:
          FRAUD_API_KEY: ${{ secrets.FRAUD_API_KEY }}

  fly:
    needs: checks
    runs-on: ubuntu-latest
    if: ${{ vars.FLY_APP != '' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy the image built for this tag
        run: |
          flyctl deploy --app "$FLY_APP" \
            --image "registry.fly.io/$FLY_APP:${GITHUB_REF_NAME}" \
            --strategy immediate
      - uses: astral-sh/setup-uv@v6
      - name: Verify the live service (health + parity, model-info, scored sample)
        run: uv run --no-project python scripts/deploy_check.py "https://$FLY_APP.fly.dev"
        env:
          FRAUD_API_KEY: ${{ secrets.FRAUD_API_KEY }}

  release:
    needs: [checks, render, fly]
    # Override the default success() so an unconfigured host may be skipped.
    if: >-
      ${{ !cancelled() &&
          needs.checks.result == 'success' &&
          (needs.render.result == 'success' || needs.render.result == 'skipped') &&
          (needs.fly.result == 'success' || needs.fly.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release from the tag
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "Served model: see models/champion/model_manifest.json on the release machine (weights are not published). Performance: README → Performance."
        env:
          GH_TOKEN: ${{ github.token }}
