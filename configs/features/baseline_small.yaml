# Small, interpretable subset for the logistic-regression baseline (E002b):
# amount, product, card type, billing region, both e-mail domains, all C counts
# (never null) and the three least-null D deltas. One-hot vocabularies are
# learned on the training window; e-mail domains have 59/60 levels, fine for
# one-hot in a linear model.
name: baseline_small
target: isFraud
id_col: TransactionID
time_col: TransactionDT

numeric:
  explicit: [TransactionAmt, addr1, addr2, C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14, D1, D10, D15]
  prefixes: []
  identity_numeric: false
  boolean: [has_identity]

categorical:
  - ProductCD
  - card4
  - card6
  - P_emaildomain
  - R_emaildomain
