# E003: gradient-boosted trees on the same raw feature set as E002. One change
# vs E002: the model (and the tree preprocessing it needs — no impute/scale).
# Fixed number of trees; no early stopping, so validation is not used to pick
# anything.
experiment: fraud-xgboost
run_name: xgb_raw
features: configs/features/baseline.yaml
seed: 42
threshold: 0.5
model:
  type: xgboost
  params:
    n_estimators: 600
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.6
    reg_lambda: 1.0
    eval_metric: aucpr
    n_jobs: 8
