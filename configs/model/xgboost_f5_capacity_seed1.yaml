# E022: the sweep's direction — more capacity (depth 12, min_child_weight 1,
# 1600 trees at eta 0.05), feature set unchanged from E016.
experiment: fraud-xgboost
run_name: xgb_f5_capacity_seed1
features: configs/features/f5_interactions.yaml
seed: 1
threshold: 0.5
model:
  type: xgboost
  params:
    n_estimators: 1600
    learning_rate: 0.05
    max_depth: 12
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.5
    reg_lambda: 1.0
    reg_alpha: 1.0
    eval_metric: aucpr
    n_jobs: 8
