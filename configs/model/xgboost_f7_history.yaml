# E017: E016 (current best) + feature set f7_history (one change: the history features).
experiment: fraud-xgboost
run_name: xgb_f7_history
features: configs/features/f7_history.yaml
seed: 42
threshold: 0.5
model:
  type: xgboost
  params:
    n_estimators: 800
    learning_rate: 0.05
    max_depth: 8
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.5
    reg_lambda: 1.0
    reg_alpha: 1.0
    eval_metric: aucpr
    n_jobs: 8
