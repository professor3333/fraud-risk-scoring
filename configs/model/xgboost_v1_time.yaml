# E005: E003 + hour of day and weekday (configs/features/v1_time.yaml).
experiment: fraud-xgboost
run_name: xgb_v1_time
features: configs/features/v1_time.yaml
seed: 42
threshold: 0.5
model:
  type: xgboost
  params:
    n_estimators: 600
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.6
    reg_lambda: 1.0
    eval_metric: aucpr
    n_jobs: 8
