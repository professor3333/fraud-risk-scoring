# E006: E003 + frequency encoding (configs/features/v2_freq.yaml, ADR 0005).
experiment: fraud-xgboost
run_name: xgb_v2_freq
features: configs/features/v2_freq.yaml
seed: 42
threshold: 0.5
model:
  type: xgboost
  params:
    n_estimators: 600
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.6
    reg_lambda: 1.0
    eval_metric: aucpr
    n_jobs: 8
