# E011: E008 with median imputation + missing indicators in front of the trees (preprocessing: linear).
experiment: fraud-xgboost
run_name: xgb_v2_tuned_impute
features: configs/features/v2_freq.yaml
seed: 42
threshold: 0.5
model:
  type: xgboost
  preprocessing: linear   # median impute + indicators (+ scaling, harmless for trees)
  params:
    n_estimators: 800
    learning_rate: 0.05
    max_depth: 8
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.5
    reg_lambda: 1.0
    reg_alpha: 1.0
    eval_metric: aucpr
    n_jobs: 8
