# Serving configuration (§6). The API loads exactly the calibrated pipeline
# object that produced the validation metrics (G8).
# models/champion/ is written only by scripts/promote.py (ADR 0010): the artifact, its
# frozen golden, its monitoring reference and a manifest. When the manifest exists,
# model_version, model_info and bands below are replaced by the manifest's values —
# they remain here as the fallback for a directory without one (CI's fixture artifact).
model_path: models/champion/model.joblib
model_version: xgb_f5_capacity+sigmoid
# Startup parity check against the frozen sample next to the artifact (G8).
require_parity: true
# Production policy (docs/review_policy.md): block at bands.block (the 80 % precision
# bar on validation); review the highest remaining scores up to the analyst budget
# (rank policy) or down to bands.review (threshold policy); approve the rest.
# The evaluation threshold 0.08 (ADR 0006, configs/threshold.yaml) is reporting
# material only and is not served.
bands:
  review: 0.062
  block: 0.42
# Facts about the served model, for /model-info (numbers from reports/ and MLflow).
model_info:
  model: xgboost
  experiment: E022
  feature_set: f5_interactions
  primary_metric: pr_auc
  validation_pr_auc: 0.6367
  test_pr_auc: 0.5610
  calibration: sigmoid
  training_window_days: [1, 122]
  validation_window_days: [123, 152]
# Largest CSV upload accepted by /predict/csv, in bytes (5,000 rows of the raw schema is
# ~6 MB); the row limit (5,000) is checked while parsing, not after.
max_upload_bytes: 26214400
# Default analyst review capacity per batch / upload for the rank-based policy
# (docs/review_policy.md: block by threshold, review the top N remaining, approve the rest).
default_review_budget: 200
# Prediction audit trail (SQLite, one row per scored transaction). Path relative to the
# repo root; FRAUD_AUDIT_DB overrides it; null disables auditing.
audit_db: models/audit/prediction_events.sqlite
