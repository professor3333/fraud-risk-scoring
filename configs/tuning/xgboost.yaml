# E008: random search over XGBoost hyperparameters with expanding-window CV
# inside the training window (ADR 0002). Validation is never folded.
experiment: fraud-tuning
features: configs/features/v2_freq.yaml
seed: 42
n_trials: 16
# Expanding-window folds: (train_end_day, val_start_day, val_end_day)
folds:
  - {train_end_day: 62, val_start_day: 63, val_end_day: 92}
  - {train_end_day: 92, val_start_day: 93, val_end_day: 122}
fixed:
  eval_metric: aucpr
  n_jobs: 8
space:
  n_estimators: [400, 800, 1200]
  learning_rate: [0.02, 0.05, 0.1]
  max_depth: [4, 6, 8, 10]
  min_child_weight: [1, 5, 20, 50]
  subsample: [0.6, 0.8, 1.0]
  colsample_bytree: [0.3, 0.5, 0.7]
  reg_lambda: [1.0, 5.0, 20.0]
  reg_alpha: [0.0, 1.0]
# The untuned E006 parameters, scored on the same folds as a reference.
reference:
  n_estimators: 600
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.6
  reg_lambda: 1.0
