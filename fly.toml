# Fly.io app definition (docs/deployment.md). The image is built from the
# repository Dockerfile with the local artifact and its frozen sample; it is
# pushed to Fly's private registry, so the model weights are not published.
app = "fraud-risk-scoring"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"     # scale to zero when idle (free-tier friendly)
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

[[http_service.checks]]
  grace_period = "60s"            # model load + startup parity check
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                  # pandas + xgboost + the 41 MB artifact need ~600 MB
