[project]
name = "fraud"
version = "0.1.0"
description = "Fraud risk scoring on the IEEE-CIS Fraud Detection dataset: temporal validation, XGBoost, calibrated thresholds, FastAPI serving."
authors = [
    { name = "Niroj33", email = "86530493+professor3333@users.noreply.github.com" }
]
requires-python = ">=3.12"
# Runtime dependencies are what the service needs; training-only tools live in
# the `train` group so the Docker image stays small.
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "xgboost>=3.4.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
train = [
    "pyarrow>=17",
    "matplotlib>=3.9",
    "mlflow>=3.16.0",
]
dev = [
    {include-group = "train"},
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyter>=1.1",
    "pandas-stubs",
    "types-pyyaml",
    "kaggle>=2.2.4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "mlflow.*", "matplotlib.*", "xgboost.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the full dataset; excluded from the default run"]
addopts = "-m 'not slow'"

[tool.ruff.lint.per-file-ignores]
"src/fraud/pipeline/*" = ["N803"]  # sklearn's fit(X, y) signature
"src/fraud/features/derive.py" = ["N803"]
"src/fraud/features/encoders.py" = ["N803"]
