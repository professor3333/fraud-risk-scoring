# Render blueprint (docs/deployment.md): the free public demo. One Docker web service
# built from this repository with deploy/hosted/Dockerfile — no model in the image;
# the service fetches models/champion/ at startup from the champion-<sha> GitHub
# release of this repository (scripts/publish_champion.py). Deploys are triggered by the release workflow through a deploy hook, not by
# every push (autoDeploy: false).
services:
  - type: web
    name: fraud-risk-scoring
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: deploy/hosted/Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      # The champion-<sha12> tag is the digest the artifact is pinned against before
      # it is deserialized; an untagged URL needs FRAUD_CHAMPION_SHA256 instead.
      - key: FRAUD_CHAMPION_URL       # https://github.com/<owner>/<repo>/releases/download/champion-<sha12>
        sync: false
      # No worker-count variable, deliberately. The service must run as ONE process: the
      # review budget and the rate limiter both live in that process's memory and its SQLite
      # audit trail, so two workers would hand the same transaction different actions
      # (docs/model_card.md, "The features are stateless; the service is not"). A knob that
      # appears to control worker count would invite raising it; the Dockerfiles start a
      # single worker and say why.
